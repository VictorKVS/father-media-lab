[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "father-media-lab"
version = "0.1.0"
description = "Evidence-driven image and video generation laboratory"
requires-python = ">=3.11"

[project.scripts]
father-media-lab = "father_media_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
